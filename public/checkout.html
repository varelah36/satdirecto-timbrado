<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes SAT Directo</title>
  <style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px} .card{border:1px solid #ddd;padding:16px;border-radius:8px;margin:12px 0} .error{color:#b00020} .ok{color:#0a7f2e}</style>
</head>
<body>
  <h1>Suscripciones SAT Directo</h1>
  <p>Ingresa tu token (login/register) y selecciona un plan para ir a Stripe Checkout.</p>

  <label>Backend URL</label>
  <input id="baseUrl" style="width:100%" value="https://satdirecto-timbrado-production.up.railway.app" />
  <br/><br/>
  <label>Bearer token</label>
  <input id="token" style="width:100%" placeholder="eyJ..." />

  <div class="card">
    <h3>Plan Esencial</h3>
    <label>Cobro</label>
    <select id="billing">
      <option value="monthly">Mensual</option>
      <option value="annual">Anual</option>
    </select>
    <button id="btnCheckout">Ir a Checkout</button>
  </div>

  <p id="status"></p>

  <script>
    const statusEl = document.getElementById('status');
    const tokenEl = document.getElementById('token');
    const billingEl = document.getElementById('billing');
    const baseUrlEl = document.getElementById('baseUrl');

    function showError(msg){ statusEl.className='error'; statusEl.textContent = msg; }
    function showOk(msg){ statusEl.className='ok'; statusEl.textContent = msg; }

    document.getElementById('btnCheckout').addEventListener('click', async () => {
      statusEl.textContent = 'Creando checkout...';
      const token = tokenEl.value.trim();
      const baseUrl = baseUrlEl.value.trim().replace(/\/$/, '');

      if (!token) {
        showError('Falta token. Inicia sesión / regístrate y pega aquí el Bearer token.');
        return;
      }

      try {
        const response = await fetch(`${baseUrl}/stripe/create-checkout-session`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ plan: 'esencial', billing: billingEl.value })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'No se pudo crear checkout.');
          return;
        }

        if (!data.url) {
          showError('El backend no devolvió URL de checkout.');
          return;
        }

        showOk('Redirigiendo a Stripe...');
        window.location.href = data.url;
      } catch (err) {
        showError('Error de red al crear checkout: ' + err.message);
      }
    });
  </script>
</body>
</html>
